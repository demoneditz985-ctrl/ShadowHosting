<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shadow Hosting</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/css/xterm.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0e1a;
    --panel: #15172a;
    --panel-2: #1c1f38;
    --line: #2a2d4a;
    --text: #d7d9ec;
    --muted: #8488ab;
    --accent: #9b8cff;
    --accent-dim: #4d4480;
    --ok: #6ee7b7;
    --warn: #fbbf77;
    --bad: #f28b82;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background: radial-gradient(1200px 600px at 20% -10%, #1a1c35 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---- Login ---- */
  #login{ height:100%; display:flex; align-items:center; justify-content:center; }
  #login .card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:36px 32px; width:320px; text-align:center;
  }
  #login h1{ font-size:22px; margin:0 0 4px; letter-spacing:0.3px; }
  #login p{ color:var(--muted); font-size:13px; margin:0 0 20px; }
  input{
    width:100%; padding:10px 12px; border-radius:6px; border:1px solid var(--line);
    background:#0f1124; color:var(--text); font-size:14px; margin-bottom:12px;
  }
  button{
    cursor:pointer; border:none; border-radius:6px; padding:9px 14px;
    font-size:13px; font-weight:500; font-family:inherit;
  }
  .btn-primary{ background:var(--accent); color:#10101c; width:100%; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn-danger{ background:transparent; border:1px solid var(--bad); color:var(--bad); }
  #login-error{ color:var(--bad); font-size:12px; min-height:16px; margin-top:4px; }

  /* ---- App ---- */
  #app{ display:none; height:100%; }
  .shell{ display:flex; height:100%; }
  .sidebar{
    width:250px; border-right:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column;
  }
  .sidebar-head{ padding:18px 16px 12px; border-bottom:1px solid var(--line); }
  .sidebar-head .brand{ font-size:16px; font-weight:600; }
  .sidebar-head .brand span{ color:var(--accent); }
  .bot-list{ flex:1; overflow-y:auto; padding:8px; }
  .bot-item{
    padding:10px 12px; border-radius:6px; cursor:pointer; margin-bottom:4px;
    display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px;
  }
  .bot-item:hover{ background:var(--panel-2); }
  .bot-item.active{ background:var(--panel-2); color:var(--text); }
  .dot{ width:7px; height:7px; border-radius:50%; flex:none; background:var(--muted); }
  .dot.running{ background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .dot.stopped{ background:var(--muted); }
  .dot.starting, .dot.restarting{ background:var(--warn); }
  .sidebar-foot{ padding:12px; border-top:1px solid var(--line); }

  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar{
    padding:16px 20px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; justify-content:space-between;
  }
  .topbar .title{ font-size:15px; font-weight:500; }
  .topbar .status{ font-size:12px; color:var(--muted); margin-top:2px; }
  .controls{ display:flex; gap:8px; }
  #terminal-wrap{ flex:1; padding:14px; min-height:0; }
  #terminal{ height:100%; }
  .empty{ flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }

  /* modal */
  .modal-bg{
    display:none; position:fixed; inset:0; background:rgba(5,5,12,0.6);
    align-items:center; justify-content:center; z-index:10;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    width:420px; padding:24px; max-height:85vh; overflow-y:auto;
  }
  .modal h2{ margin:0 0 14px; font-size:16px; }
  textarea{
    width:100%; min-height:140px; background:#0f1124; color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:10px; font-size:12px;
    margin-bottom:12px; resize:vertical;
  }
  label{ font-size:12px; color:var(--muted); display:block; margin-bottom:6px; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>Shadow Hosting</h1>
    <p>sign in to manage your bots</p>
    <input id="pw" type="password" placeholder="Admin password" />
    <button class="btn-primary" onclick="login()">Enter</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="app">
  <div class="shell">
    <div class="sidebar">
      <div class="sidebar-head">
        <div class="brand">Shadow<span>Hosting</span></div>
      </div>
      <div class="bot-list" id="bot-list"></div>
      <div class="sidebar-foot">
        <button class="btn-primary" style="width:100%" onclick="openAdd()">+ Add bot</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div>
          <div class="title" id="active-title">Select a bot</div>
          <div class="status" id="active-status"></div>
        </div>
        <div class="controls" id="controls" style="display:none">
          <button class="btn-ghost" onclick="action('start')">Start</button>
          <button class="btn-ghost" onclick="action('restart')">Restart</button>
          <button class="btn-ghost" onclick="action('stop')">Stop</button>
          <button class="btn-danger" onclick="removeBot()">Delete</button>
        </div>
      </div>
      <div id="terminal-wrap" style="display:none"><div id="terminal"></div></div>
      <div class="empty" id="empty-state">Add a bot on the left to get started</div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h2>Add a new bot</h2>
    <label>Bot name</label>
    <input id="bot-name" placeholder="e.g. support-bot" />
    <label>main.py source</label>
    <textarea id="bot-code" class="mono" placeholder="# paste your Telegram bot's Python code here"></textarea>
    <label>requirements.txt (optional — leave blank and modules are auto-detected and installed)</label>
    <textarea id="bot-reqs" class="mono" style="min-height:60px" placeholder="Leave blank to auto-install whatever the code imports"></textarea>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAdd()">Cancel</button>
      <button class="btn-primary" onclick="submitAdd()">Create & deploy</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
<script>
let token = localStorage.getItem('sh_token') || null;
let bots = [];
let activeId = null;
let term = null;
let socket = null;

async function api(path, opts={}){
  opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if(token) opts.headers['Authorization'] = 'Bearer '+token;
  const res = await fetch(path, opts);
  if(res.status === 401){ logout(); throw new Error('unauthorized'); }
  return res;
}

async function login(){
  const password = document.getElementById('pw').value;
  const res = await fetch('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password})
  });
  if(!res.ok){
    document.getElementById('login-error').textContent = 'Wrong password';
    return;
  }
  const data = await res.json();
  token = data.token;
  localStorage.setItem('sh_token', token);
  boot();
}

function logout(){
  token = null; localStorage.removeItem('sh_token');
  document.getElementById('login').style.display='flex';
  document.getElementById('app').style.display='none';
}

async function boot(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  await refreshBots();
  setInterval(refreshBots, 4000);
}

async function refreshBots(){
  try{
    const res = await api('/api/bots');
    bots = await res.json();
    renderList();
    if(activeId) updateTopbar();
  }catch(e){}
}

function renderList(){
  const list = document.getElementById('bot-list');
  list.innerHTML = '';
  for(const b of bots){
    const el = document.createElement('div');
    el.className = 'bot-item' + (b.id===activeId ? ' active' : '');
    el.innerHTML = `<span class="dot ${b.status}"></span><span>${b.name}</span>`;
    el.onclick = () => selectBot(b.id);
    list.appendChild(el);
  }
}

function updateTopbar(){
  const b = bots.find(x=>x.id===activeId);
  if(!b) return;
  document.getElementById('active-title').textContent = b.name;
  document.getElementById('active-status').textContent = 'status: ' + b.status;
}

function selectBot(id){
  activeId = id;
  renderList();
  updateTopbar();
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('terminal-wrap').style.display = 'block';
  connectTerminal(id);
}

function connectTerminal(id){
  if(socket) socket.close();
  if(term) { term.dispose(); }
  term = new Terminal({
    theme:{ background:'#0f1124', foreground:'#d7d9ec', cursor:'#9b8cff' },
    fontFamily:"'IBM Plex Mono', monospace", fontSize:13, convertEol:true
  });
  term.open(document.getElementById('terminal'));
  term.writeln('connecting...');

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  socket = new WebSocket(`${proto}://${location.host}/ws?id=${id}&token=${token}`);
  socket.onopen = () => term.clear();
  socket.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if(msg.type === 'backlog'){
      term.clear();
      for(const l of msg.lines) term.write(l);
    } else if(msg.type === 'log'){
      term.write(msg.line);
    } else if(msg.type === 'status'){
      const b = bots.find(x=>x.id===id);
      if(b){ b.status = msg.status; renderList(); updateTopbar(); }
    }
  };
  term.onData((data) => {
    if(socket.readyState === 1) socket.send(JSON.stringify({type:'stdin', data}));
  });
}

async function action(type){
  if(!activeId) return;
  await api(`/api/bots/${activeId}/${type}`, {method:'POST'});
  refreshBots();
}

async function removeBot(){
  if(!activeId) return;
  if(!confirm('Delete this bot permanently?')) return;
  await api(`/api/bots/${activeId}`, {method:'DELETE'});
  activeId = null;
  document.getElementById('controls').style.display='none';
  document.getElementById('terminal-wrap').style.display='none';
  document.getElementById('empty-state').style.display='flex';
  document.getElementById('active-title').textContent='Select a bot';
  document.getElementById('active-status').textContent='';
  refreshBots();
}

function openAdd(){ document.getElementById('modal-bg').style.display='flex'; }
function closeAdd(){ document.getElementById('modal-bg').style.display='none'; }

async function submitAdd(){
  const name = document.getElementById('bot-name').value.trim();
  const code = document.getElementById('bot-code').value;
  const reqs = document.getElementById('bot-reqs').value;
  if(!name || !code){ alert('Name and code are required'); return; }
  const fd = new FormData();
  fd.append('name', name);
  fd.append('requirements', reqs);
  fd.append('file', new Blob([code], {type:'text/x-python'}), 'main.py');
  const res = await fetch('/api/bots', {
    method:'POST', headers:{'Authorization':'Bearer '+token}, body: fd
  });
  if(!res.ok){ alert('Failed to create bot'); return; }
  const data = await res.json();
  closeAdd();
  document.getElementById('bot-name').value='';
  document.getElementById('bot-code').value='';
  document.getElementById('bot-reqs').value='';
  await refreshBots();
  selectBot(data.id);
  action('start');
}

if(token) boot();
</script>
</body>
</html>
